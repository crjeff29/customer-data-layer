name: IssueWithBranch

on:
  issues:
    types: [opened]


jobs:
  onCreated:
    runs-on: ubuntu-latest
  
    steps:
    - name: "Set flag from Commit"
      run: |
          titulo="${{ github.event.issue.title }}"
          title=${titulo// /_}
          title=${title//-/_}
          echo $title
          echo "flag=${title}" >> $GITHUB_ENV
        

    - uses: actions/checkout@v2
    - uses: jonahgoldwastaken/issue-branch@v1.0.2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name_pattern:  ${{ env.flag }}-{number}
        run: |
          NUMBER: ${{ env.flag }}
          echo ${{ env.flag }}

          
    - name: Configurar Git
      run: |
          git config --global user.name "BA-jnzavalas-dev-adm"
          git config --global user.email "jnzavalas@bancatlan.hn"
          
   
      
          
  add-comment:
        runs-on: ubuntu-latest
        needs: onCreated
        # asignación de permisos especiales de escritura para poder realizar menciones y/o comentarios automaticos a las tareas
        permissions:
          issues: write
        steps:
          - name: Add comment 
          #extraccion de información de colaboradores
            run: |
              # Utiliza 'gh' de GitHub CLI para obtener una lista de colaboradores en JSON
              gh api "/repos/${{ github.repository }}/collaborators" -q .[].login > colaboradores.json
              
              colaboradores=$(cat colaboradores.json)
              for colaborador in $colaboradores; do
               MENSION+=' '@$colaborador
               
              done
              echo "collab=$MENSION" >> $GITHUB_ENV
              echo "mensiones:" $MENSION
            env:
              GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          - uses: peter-evans/create-or-update-comment@5f728c3dae25f329afbe34ee4d08eef25569d79f
            with:
              issue-number: ${{ github.event.issue.number }}
              body: |
                La tarea correspondiente a ${{ github.event.issue.title }}, con  numero #${{ github.event.issue.number }} está siendo trabajada por @${{ github.actor }} , favor los colaboradores: ${{ env.collab }}. Ante cualquier tipo de enventualidad los administradores @BA-jnzavalas-dev-adm estarán de apoyo.
 
  assign-issue-to-user:
      name: Assign to user
      runs-on: ubuntu-latest
      steps:
        - name: Assign issue to user
          uses: pozil/auto-assign-issue@v1
          # https://github.com/marketplace/actions/auto-assign-issue
          with:
            assignees: ${{ github.actor }}
            numOfAssignee: 1
            allowSelfAssign: true
            abortIfPreviousAssignees: true
