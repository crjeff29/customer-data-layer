
name: Stale Branches

on:
  schedule:
    - cron: 0 9 * * 1-5 
  
  workflow_dispatch:
    
permissions:
  issues: write
  contents: write

jobs:
  stale_branches:
    runs-on: ubuntu-latest
    steps:
    - name: Stale Branches
      uses: crs-k/stale-branches@v3.0.0
      with:
        repo-token: '${{ secrets.GITHUB_TOKEN }}'
        days-before-stale: 120
        days-before-delete: 180
        comment-updates: true
        max-issues: 20
        tag-committer: true
        stale-branch-label: 'rama antigua 🗑️'
        compare-branches: 'info'
        branches-filter-regex: '^((?!dependabot|main|DEV|QA|PRD|H-*))'
        
