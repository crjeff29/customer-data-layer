syntax = "proto3";
option java_package = "com.customer.grpc";
option java_outer_classname = "CustomerProtoServiceAccess";
option java_multiple_files = true;

service CustomerAccessService{
  rpc getCustomer(BusinessPartner) returns (CustomerResponse);
  rpc addCustomer(CustomerRequest) returns (CustomerResponse);
  rpc updateCustomer(CustomerRequest) returns (CustomerResponse);
  rpc disableCustomer(BusinessPartner) returns (CustomerResponse);
}

message BusinessPartner{
  string businessPartner = 1;
}

message CustomerRequest{

  string businessPartner = 1;
  string name = 2;
  string idDocumentList = 3;
  string address = 4;
  string phone = 5;
  string idCustomerStatusList = 6;
  string idCustomerTypeList = 7;
  string idCustomerLevelList = 8;
  string idGroup = 9;
  string emailAddress = 10;
}
message CustomerResponse{
  string id = 1;
  string businessPartner = 2;
  string name = 3;
  string idDocumentList = 4;
  string address = 5;
  string phone = 6;
  string idCustomerStatusList = 7;
  string idCustomerTypeList = 8;
  string idCustomerLevelList = 9;
  string idGroup = 10;
  string emailAddress = 11;
}